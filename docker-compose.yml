# One container per BMC session.
#
# MegaRAC firmware allows only a couple of concurrent iKVM sessions and an abandoned
# one keeps its slot until the BMC times it out, so do not scale a service past 1.
# To reach a second server, copy the block and give it its own name and host port.
services:
  lab-ami:
    build: .
    image: localhost/oldipmi-kvm
    container_name: kvm-lab-ami
    # Bound to loopback on purpose: this is an unauthenticated path to a server
    # console and its power controls. Reach it over an SSH tunnel, or put your own
    # authenticating proxy in front before changing this.
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      # All three are optional now: with none of them set the container comes up on the
      # connect page instead of refusing to start, and you type them there or drop a
      # .jnlp in. With all three set it autoconnects at boot, exactly as it used to.
      BMC_HOST: "${BMC_HOST:-lab-ami.example.net}"
      BMC_USER: "${BMC_USER:-}"
      BMC_PASS: "${BMC_PASS:-}"
      # HTTP basic auth (user 'kvm') over the whole surface -- page, API, console and
      # the WebSocket. Off by default; see "Exposure" in the README.
      WEB_PASSWORD: "${WEB_PASSWORD:-}"
      # Second line of defence if you ever expose the port.
      VNC_PASSWORD: "${VNC_PASSWORD:-}"
      SCREEN_GEOMETRY: "${SCREEN_GEOMETRY:-1280x1024x24}"
    restart: "no"
